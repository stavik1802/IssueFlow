server:
  port: 8080

spring:
  application:
    name: issueflow
  datasource:
    url: jdbc:h2:mem:db;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    driverClassName: org.h2.Driver
  sql:
    init:
      mode: never
      platform: mssql
  h2:
    console:
      enabled: true
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

issueflow:
  attachments:
    upload-directory: ${java.io.tmpdir}/issueflow-test-attachments
  security:
    auth:
      password: secret
    jwt:
      secret: test-secret-key-that-is-long-enough-for-hmac-sha256
      expiration: 1h
